<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10">
<title>VOID — заметки и задачи</title>
<style>
:root{--bg:#09090d;--panel:#111118;--panel2:#171722;--line:#292638;--text:#f3f0ff;--muted:#9a96ad;--accent:#b45cff;--accent2:#762cff;--good:#75e0b0;--danger:#ff657e;--warn:#ffc66e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#291442 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:24px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.brand{display:flex;gap:12px;align-items:center}.logo{height:45px;width:45px;border:1px solid #a94cff;border-radius:14px;display:grid;place-items:center;color:#d9adff;font-weight:900;font-size:19px;box-shadow:0 0 28px #8d36ff24}.brand h1{font-size:21px;letter-spacing:3px;margin:0}.brand p{color:var(--muted);font-size:12px;margin:2px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text);transition:.15s}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#a746f5,#6f2bd2);border-color:transparent}.btn.danger{color:#ff9aaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{padding:17px;border:1px solid var(--line);background:#111118d9;border-radius:15px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 15px;border-radius:10px}.tab.active{color:white;background:#57278b65;border-color:#a24af0}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.search{flex:1;min-width:0}.field{width:100%;background:#0b0b11;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a84cff19}textarea.field{resize:vertical;min-height:120px}.toolbar select{max-width:180px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:16px;align-items:start}.section{border:1px solid var(--line);background:#101017e8;border-radius:16px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 17px;border-bottom:1px solid var(--line)}.section-head h2{font-size:15px;margin:0}.section-head small{color:var(--muted)}.list{padding:10px;display:grid;gap:9px}.item{border:1px solid #2a2738;background:linear-gradient(145deg,#171720,#111117);border-radius:12px;padding:13px;min-width:0}.item-top{display:flex;gap:10px;align-items:flex-start}.check{width:19px;height:19px;accent-color:#ad55ff;flex-shrink:0;margin-top:3px}.item-main{min-width:0;flex:1}.item-title{font-weight:650;overflow-wrap:anywhere}.item-body{color:#b5b0c7;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;font-size:13px}.item.done .item-title{text-decoration:line-through;color:#89849b}.item.done{opacity:.7}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}.pill{padding:3px 7px;border-radius:6px;background:#262033;color:#d4b4ff}.pill.high{color:#ff9bab;background:#3b2029}.pill.low{color:#94e5bd;background:#183329}.item-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#1b1a25;color:#c8c2d8;border-radius:7px;padding:6px 9px;font-size:12px}.mini:hover{border-color:var(--accent);color:white}.empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}.side-form{padding:16px;display:grid;gap:11px}.side-form h3{font-size:15px;margin:0 0 2px}.side-form label{display:grid;gap:6px;color:#bcb6ce;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-buttons{display:flex;gap:8px}.form-buttons button{flex:1}.hidden{display:none!important}.foot{color:#777287;font-size:11px;text-align:center;margin-top:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#211a2d;border:1px solid #6f3e9b;padding:10px 15px;border-radius:10px;box-shadow:0 10px 40px #0008;z-index:5}.note-color{width:8px;align-self:stretch;border-radius:8px;background:var(--accent);flex-shrink:0}.note-layout{display:flex;gap:11px}.note-content{min-width:0;flex:1}@media(max-width:760px){.app{padding:16px 12px 35px}.top{align-items:flex-start}.brand h1{font-size:18px}.top-actions .btn{padding:8px 10px;font-size:12px}.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.toolbar{flex-wrap:wrap}.toolbar select{flex:1;max-width:none}.section-head{padding:14px}.side-form{padding:14px}}@media(max-width:390px){.stats{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.stat strong{margin:0}.brand p{font-size:11px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">V.</div><div><h1>VOID <span style="color:#b45cff">/ OS</span></h1><p>Личное пространство · заметки и задачи</p></div></div><div class="top-actions"><button class="btn" id="exportBtn">Экспорт данных</button><button class="btn" id="importBtn">Импорт</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></header>
<div class="stats"><div class="stat"><span>Всего задач</span><strong id="statAll">0</strong></div><div class="stat"><span>Выполнено</span><strong id="statDone">0</strong></div><div class="stat"><span>Заметок</span><strong id="statNotes">0</strong></div></div>
<nav class="tabs"><button class="tab active" data-tab="tasks">Задачи</button><button class="tab" data-tab="notes">Заметки</button><button class="tab" data-tab="all">Всё вместе</button></nav>
<div class="toolbar"><input id="search" class="field search" placeholder="Поиск по названию и содержимому…"><select id="filter" class="field"><option value="all">Все задачи</option><option value="active">Активные</option><option value="done">Выполненные</option><option value="high">Высокий приоритет</option></select><button id="newBtn" class="btn primary">＋ Создать</button></div>
<div class="layout"><section class="section"><div class="section-head"><h2 id="listTitle">Мои задачи</h2><small id="countLabel">0 элементов</small></div><div id="items" class="list"></div></section>
<aside class="section"><div class="section-head"><h2 id="formHeading">Новая задача</h2><small>Редактирование</small></div><form id="editor" class="side-form"><input type="hidden" id="editId"><label>Тип<select class="field" id="type"><option value="task">Задача</option><option value="note">Заметка</option></select></label><label>Название<input class="field" id="title" maxlength="160" placeholder="Например, подготовить документы" required></label><label>Описание / текст<textarea class="field" id="body" placeholder="Подробности, идеи, ссылки…"></textarea></label><div id="taskFields"><div class="two"><label>Срок<input class="field" id="due" type="date"></label><label>Приоритет<select class="field" id="priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="low">Низкий</option></select></label></div></div><label>Категория<input class="field" id="category" maxlength="40" placeholder="Работа, личное, идеи…"></label><div class="form-buttons"><button class="btn primary" type="submit" id="saveBtn">Сохранить</button><button class="btn" type="button" id="cancelBtn">Очистить</button></div></form></aside></div>
<p class="foot">Данные сохраняются на этом устройстве автоматически. Сайт работает без интернета. Экспортируйте резервную копию время от времени.</p></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';const KEY='void_os_data_v1';let tasks=[],notes=[],tab='tasks',toastTimer;const $=id=>document.getElementById(id);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');tasks=Array.isArray(d.tasks)?d.tasks:[];notes=Array.isArray(d.notes)?d.notes:[]}catch{tasks=[];notes=[]}}function persist(){try{localStorage.setItem(KEY,JSON.stringify({tasks,notes}));return true}catch{notify('Не удалось сохранить данные. Освободите место в браузере.');return false}}function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}function resetForm(){ $('editor').reset();$('editId').value='';$('type').value=tab==='notes'?'note':'task';$('formHeading').textContent='Новая '+( $('type').value==='note'?'заметка':'задача');$('saveBtn').textContent='Сохранить';$('taskFields').classList.toggle('hidden',$('type').value==='note') }function editItem(type,id){const a=type==='task'?tasks:notes;const x=a.find(i=>i.id===id);if(!x)return;$('editId').value=x.id;$('type').value=type;$('title').value=x.title||'';$('body').value=x.body||'';$('category').value=x.category||'';$('due').value=x.due||'';$('priority').value=x.priority||'normal';$('taskFields').classList.toggle('hidden',type==='note');$('formHeading').textContent='Редактировать '+(type==='note'?'заметку':'задачу');$('saveBtn').textContent='Сохранить изменения';$('editor').scrollIntoView({behavior:'smooth',block:'nearest'});$('title').focus()}function del(type,id){if(!confirm('Удалить '+(type==='note'?'эту заметку':'эту задачу')+'?'))return;if(type==='task')tasks=tasks.filter(x=>x.id!==id);else notes=notes.filter(x=>x.id!==id);persist();render();if($('editId').value===id)resetForm();notify('Удалено')}function toggle(id){const x=tasks.find(t=>t.id===id);if(x){x.done=!x.done;persist();render();notify(x.done?'Задача выполнена':'Задача возвращена в активные')}}function card(type,x){const isTask=type==='task';let meta='';if(x.category)meta+=`<span class="pill">${esc(x.category)}</span>`;if(isTask){meta+=`<span class="pill ${x.priority==='high'?'high':x.priority==='low'?'low':''}">${x.priority==='high'?'Высокий приоритет':x.priority==='low'?'Низкий приоритет':'Обычный'}</span>`;if(x.due)meta+=`<span>Срок: ${esc(x.due)}</span>`;if(x.done)meta+='<span style="color:var(--good)">Выполнено</span>'}meta+=`<span>${new Date(x.updated||x.created||Date.now()).toLocaleDateString('ru-RU')}</span>`;return `<article class="item ${isTask&&x.done?'done':''}"><div class="${isTask?'item-top':'note-layout'}">${isTask?`<input class="check" type="checkbox" aria-label="Отметить выполненной" ${x.done?'checked':''} data-action="toggle" data-id="${esc(x.id)}">`:'<div class="note-color"></div>'}<div class="${isTask?'item-main':'note-content'}"><div class="item-title">${esc(x.title)}</div>${x.body?`<div class="item-body">${esc(x.body)}</div>`:''}<div class="meta">${meta}</div><div class="item-actions">${isTask&&!x.done?`<button class="mini" data-action="toggle" data-id="${esc(x.id)}">✓ Выполнить</button>`:''}<button class="mini" data-action="edit" data-type="${type}" data-id="${esc(x.id)}">✎ Изменить</button><button class="mini" data-action="delete" data-type="${type}" data-id="${esc(x.id)}">Удалить</button></div></div></div></article>`}function render(){const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;let arr=[];if(tab!=='notes')arr=arr.concat(tasks.filter(x=>filter==='all'||filter==='active'&&!x.done||filter==='done'&&x.done||filter==='high'&&x.priority==='high').map(x=>({type:'task',x})));if(tab!=='tasks')arr=arr.concat(notes.map(x=>({type:'note',x})));arr=arr.filter(o=>(o.x.title+' '+o.x.body+' '+o.x.category).toLowerCase().includes(q));arr.sort((a,b)=>{if(a.type==='task'&&b.type==='task'&&a.x.done!==b.x.done)return a.x.done?1:-1;return (b.x.updated||b.x.created||0)-(a.x.updated||a.x.created||0)});$('items').innerHTML=arr.length?arr.map(o=>card(o.type,o.x)).join(''):'<div class="empty">Ничего не найдено.<br>Создайте новую запись или измените поиск.</div>';$('countLabel').textContent=arr.length+' '+(arr.length===1?'элемент':arr.length<5?'элемента':'элементов');$('listTitle').textContent=tab==='tasks'?'Мои задачи':tab==='notes'?'Мои заметки':'Задачи и заметки';$('statAll').textContent=tasks.length;$('statDone').textContent=tasks.filter(x=>x.done).length;$('statNotes').textContent=notes.length;$('filter').classList.toggle('hidden',tab==='notes')}function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));resetForm();render()}$('type').addEventListener('change',()=>{$('taskFields').classList.toggle('hidden',$('type').value==='note');$('formHeading').textContent=($('editId').value?'Редактировать ':'Новая ')+($('type').value==='note'?'заметка':'задача')});$('editor').addEventListener('submit',e=>{e.preventDefault();const type=$('type').value,id=$('editId').value,now=Date.now(),old=(type==='task'?tasks:notes).find(x=>x.id===id);const x={id:id||uid(),title:$('title').value.trim(),body:$('body').value.trim(),category:$('category').value.trim(),created:old?.created||now,updated:now};if(!x.title){$('title').focus();return}if(type==='task'){x.due=$('due').value;x.priority=$('priority').value;x.done=old?.done||false;if(id)tasks=tasks.map(y=>y.id===id?x:y);else tasks.unshift(x)}else{if(id)notes=notes.map(y=>y.id===id?x:y);else notes.unshift(x)}persist();setTab(type==='task'?'tasks':'notes');notify(id?'Изменения сохранены':'Создано');});$('cancelBtn').addEventListener('click',resetForm);$('newBtn').addEventListener('click',()=>{resetForm();$('editor').scrollIntoView({behavior:'smooth',block:'nearest'});$('title').focus()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('items').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id,type}=b.dataset;if(action==='toggle')toggle(id);if(action==='edit')editItem(type,id);if(action==='delete')del(type,id)});$('items').addEventListener('change',e=>{if(e.target.matches('[data-action="toggle"]'))toggle(e.target.dataset.id)});$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='void-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);notify('Резервная копия подготовлена')});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tasks)||!Array.isArray(d.notes))throw Error('format');if(!confirm('Импорт заменит текущие заметки и задачи. Продолжить?'))return;tasks=d.tasks;notes=d.notes;persist();render();resetForm();notify('Данные импортированы')}catch{notify('Не удалось прочитать файл резервной копии')}finally{e.target.value=''}});load();render();resetForm();})();
</script></body></html>
